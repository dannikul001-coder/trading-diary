<script>
 function openModal(){document.getElementById('modalBackdrop').classList.add('open');}
 function closeModal(){window.activeLearningModel?.dispose?.();window.activeLearningModel=null;document.getElementById('modalBackdrop').classList.remove('open');}
 bindAdminUI();renderCourseV1View();
 (function(){
  const themes=['midnight','carbon','forest','ocean','plum','copper','paper','ivory','mist','sand','sage','lavender','navycoral','indigolime','slateorange','tealrose','auberginecyan','inkgold'],picker=document.getElementById('academyPreviewTheme');
  const names={navycoral:'Navy Coral',indigolime:'Indigo Lime',slateorange:'Slate Orange',tealrose:'Teal Rose',auberginecyan:'Aubergine Cyan',inkgold:'Ink Gold'};
  for(const theme of themes){const option=document.createElement('option');option.value=theme;option.textContent=names[theme]||theme[0].toUpperCase()+theme.slice(1);picker.append(option);}
  function apply(theme){document.body.classList.remove(...themes.map(x=>'theme-'+x));document.body.classList.add('theme-'+theme);document.body.dataset.theme=theme;picker.value=theme;}
  const selected=new URLSearchParams(location.search).get('theme');apply(themes.includes(selected)?selected:'midnight');
  picker.addEventListener('change',()=>{apply(picker.value);const url=new URL(location.href);url.searchParams.set('theme',picker.value);history.replaceState(null,'',url);});
 })();
 (function(){const params=new URLSearchParams(location.search),selected=window.TRADING_COURSE_V1.lessons.find(l=>l.key===params.get('lesson'));
 if(selected)openTrainingLesson(selected.id).then(()=>{if(params.get('material')==='practice')document.querySelector('[data-as-view="source-practice"]')?.click();else if(['theory','examples','practice','notes'].includes(params.get('tab')))document.querySelector('[data-as-tab="'+params.get('tab')+'"]')?.click();if(params.get('material')!=='practice'&&params.has('case')){const example=[...document.querySelectorAll('[data-as-example]')].find(b=>b.dataset.asExample===params.get('case'));if(example){document.querySelector('[data-as-tab="examples"]')?.click();example.click();}}});})();
 document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal();});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
</script></body></html>
