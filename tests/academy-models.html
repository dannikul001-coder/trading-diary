<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Академия · проверка моделей</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../learning-models.css"><style>body{margin:0;padding:20px}#preview{max-width:1320px;margin:auto}@media(max-width:500px){body{padding:10px}}</style></head><body><main id="preview"></main><script src="../learning/course-v1.js"></script><script src="../learning/course-models.js"></script><script src="../js/learning-interactive.js"></script><script src="../js/learning-models.js"></script><script>
(async()=>{
  await new Promise((resolve,reject)=>{const link=document.createElement('link');link.rel='stylesheet';link.href='../learning-library.css';link.onload=resolve;link.onerror=reject;document.head.appendChild(link);});
  await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='../learning/course-guides.js';script.onload=resolve;script.onerror=reject;document.head.appendChild(script);});
  for(const src of ['../learning/course-extension.js','../js/learning-indicators.js','../js/learning-math.js','../js/learning-labs.js','../js/learning-labs-advanced.js'])await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=src;script.onload=resolve;script.onerror=reject;document.head.appendChild(script);});
  await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='../js/learning-library.js';script.onload=resolve;script.onerror=reject;document.head.appendChild(script);});
  await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='../learning/course-editorial.js';script.onload=resolve;script.onerror=reject;document.head.appendChild(script);});
  for(const part of ['a','b','c'])await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='../learning/course-editorial-'+part+'.js';script.onload=resolve;script.onerror=reject;document.head.appendChild(script);});
  const host=document.getElementById('preview'),course=window.TRADING_COURSE_V1,params=new URLSearchParams(location.search);
  if(!params.has('audit')){const lesson=course.lessons.find(l=>l.key===params.get('lesson'))||course.lesson;window.InteractiveLearning.mount({host,lesson,progress:{},onSaveNotes:async notes=>localStorage.setItem('academy-preview-notes:'+lesson.id,notes)});return;}
  const assert=(condition,message)=>{if(!condition)throw new Error(message);};const results=[];
  for(const lesson of course.lessons){
    let completed=false,saved='',stages=[];const model=window.InteractiveLearning.mount({host,lesson,onStage:async p=>{stages=p.model_seen;},onSaveNotes:async notes=>{saved=notes;},onComplete:async()=>{completed=true;}}),q=s=>host.querySelector(s),m=lesson.content.interactiveLesson;
    model.finishAnimation();assert(q('[data-ml-complete]').disabled,lesson.key+': early completion');
    if(lesson.key==='12.4'){q('[data-lab-depth]').value='102';q('[data-lab-depth]').dispatchEvent(new Event('input'));assert(q('[data-lab-output]').textContent.includes('Полное заполнение100: нет'),'Midpoint is not fullfill');}
    if(lesson.key==='9.2'){q('[data-lab-order-time]').value='2';q('[data-lab-order-time]').dispatchEvent(new Event('input'));assert(q('[data-lab-output]').textContent.includes('пока не наблюдается'),'Touch is not later reaction');q('[data-lab-order-path]').value='1';q('[data-lab-order-path]').dispatchEvent(new Event('change'));q('[data-lab-order-time]').value='4';q('[data-lab-order-time]').dispatchEvent(new Event('input'));assert(q('[data-lab-output]').textContent.includes('Срок истёк без подхода'),'Untriggered condition expires');}
    if(lesson.key==='11.15'){q('[data-lab-ha-view]').value='ha';q('[data-lab-ha-view]').dispatchEvent(new Event('change'));assert(q('[data-lab-output]').textContent.includes('C105.50'),'Synthetic HA close differs from execution');}
    if(lesson.key==='11.14'){const original=q('[data-lab-output]').textContent.match(/Наклон ([\d.-]+)/)[1];q('[data-lab-reg-reveal]').click();assert(q('[data-lab-output]').textContent.includes('Показано 18'),'New observations revealed');assert(q('[data-lab-output]').textContent.includes('Наклон '+original),'Revealing future must not refit frozen window');}
    if(lesson.key==='13.9'){assert(q('[data-lab-output]').textContent.includes('102.80 < 103,00'),'Three second outcome A');q('[data-lab-tick-path]').value='1';q('[data-lab-tick-path]').dispatchEvent(new Event('change'));assert(q('[data-lab-output]').textContent.includes('103.50 > 103,00'),'Same OHLC different intrabar outcome');}
    if(lesson.key==='13.4'){q('[data-lab-stoch-case]').value='1';q('[data-lab-stoch-case]').dispatchEvent(new Event('change'));assert(q('[data-lab-output]').textContent.includes('Пересечение линий: нет'),'Threshold crossing is not line crossing');q('[data-lab-stoch-rule]').value='momentum';q('[data-lab-stoch-rule]').dispatchEvent(new Event('change'));assert(q('[data-lab-output]').textContent.includes('согласование со структурой есть'),'Momentum condition separate from return');}
    if(m.indicatorVariants){const select=q('[data-ml-indicator-variant]');select.value='1';select.dispatchEvent(new Event('change'));assert(q('[data-ml-indicator]').textContent.includes(lesson.key==='13.6'?'SMA(10)':lesson.key==='13.2'?'VI+ (14)':'DeMarker(14)'),'Parameter variant updates calculation');}
    if(lesson.key==='1.1'){const time=q('[data-lab-time]');assert(time,'Forming candle lab');time.value='4';time.dispatchEvent(new Event('input'));assert(q('[data-lab-output]').textContent.includes('текущая 98'),'Live candle must change colour');time.value='5';time.dispatchEvent(new Event('input'));assert(q('[data-lab-output]').textContent.includes('C 102'),'Closed candle');}
    if(lesson.key==='3.1'){q('[data-lab-case]').value='1';q('[data-lab-case]').dispatchEvent(new Event('change'));q('[data-lab-answer="yes"]').click();assert(q('[data-lab-output]').textContent.includes('Проверь ещё раз'),'Reject false pattern');q('[data-lab-answer="no"]').click();assert(q('[data-lab-output]').textContent.startsWith('Верно.'),'Explain false pattern');q('[data-lab-case]').value='2';q('[data-lab-case]').dispatchEvent(new Event('change'));q('[data-lab-answer="no"]').click();assert(q('[data-lab-output]').textContent.includes('ещё формируется'),'Unclosed pattern');}
    if(lesson.key==='9.3'){q('[data-lab-entry]').value='1';q('[data-lab-entry]').dispatchEvent(new Event('change'));assert(q('[data-lab-output]').textContent.includes('ниже входа'),'Late entry changes result');}
    if(lesson.key==='9.1'){q('[data-lab-duration]').value='2';q('[data-lab-duration]').dispatchEvent(new Event('change'));assert(q('[data-lab-output]').textContent.includes('99 < 100'),'Contract ends before later recovery');assert(q('[data-lab-deadline]').getAttribute('cx')==='190','Deadline marker');}
    if(lesson.key==='3.2'){q('[data-lab-form]').value='2';q('[data-lab-form]').dispatchEvent(new Event('change'));assert(q('[data-lab-output]').textContent.includes('Линия шеи'),'Head and shoulders explanation');}
    if(lesson.key==='12.6'){const form=q('[data-lab-form]');assert(form.options.length===7,'Seven distinct formations');form.value='3';form.dispatchEvent(new Event('change'));assert(q('[data-lab-output]').textContent.includes('нисходящего импульса'),'Bear flag explanation');assert(q('[data-lab-formation]').style.d.replace(/[,\s]/g,'').includes('M2530'),'Bear flag model changes geometry');form.value='5';form.dispatchEvent(new Event('change'));assert(q('[data-lab-output]').textContent.includes('Впадины повышаются'),'Ascending triangle geometry');}
    if(lesson.key==='13.6'){q('[data-lab-rsi]').value='65';q('[data-lab-rsi]').dispatchEvent(new Event('change'));assert(q('[data-lab-output]').textContent.includes('Все условия: не выполнены'),'Conjunction needs RSI condition');}
    if(m.indicator)assert(q('[data-ml-indicator]')?.textContent.length>25,'Indicator panel missing');
    if(lesson.key==='14.3'){q('[data-lm-payout]').value='40';q('[data-lm-payout]').dispatchEvent(new Event('input',{bubbles:true}));assert(q('[data-lm-output]').textContent.includes('-0.60'),'Payout ladder worksheet');}
    if(lesson.key==='14.3'){q('[data-lm-percent-base]').value='remaining';q('[data-lm-percent-base]').dispatchEvent(new Event('change',{bubbles:true}));assert(q('[data-lm-output]').textContent.includes('8.8012%'),'Remaining-base ladder: '+q('[data-lm-output]').textContent);}
    if(lesson.key==='14.1'){q('[data-lm-base]').value='';q('[data-lm-base]').dispatchEvent(new Event('input',{bubbles:true}));assert(q('[data-lm-output]').textContent.includes('Заполни'),'Blank is not zero stake');q('[data-lm-base]').value='100';q('[data-lm-base]').dispatchEvent(new Event('input',{bubbles:true}));assert(q('[data-lm-output]').textContent.includes('55.56%'),'Break-even worksheet');}
    if(lesson.key==='14.4'){assert(q('[data-lm-output]').textContent.includes('25.00%'),'Recovery worksheet');assert(!q('[data-lm-payout]'),'Recovery has no irrelevant payout field');}
    if(lesson.key==='14.5'){assert(q('[data-lm-output]').textContent.includes('Превышение на 50.00'),'Combined daily exposure');q('[data-lm-next]').value='200';q('[data-lm-next]').dispatchEvent(new Event('input',{bubbles:true}));assert(q('[data-lm-output]').textContent.includes('запас 0.00'),'Exact daily limit');}
    if(lesson.key==='14.6'){q('[data-lm-fee]').value='80';q('[data-lm-fee]').dispatchEvent(new Event('input',{bubbles:true}));assert(q('[data-lm-output]').textContent.includes('также не даёт положительного'),'Costs can consume all payout');}
    assert(q('.ml-brief')?.textContent.includes('10 СЕКУНД'),'Lesson summary');
    q('[data-ml-view="article"]').click();assert(q('.ml-workbench').hidden&&q('[data-ml-resource]').textContent.includes('Разобранный пример'),'Full lesson view');q('[data-ml-return]').click();assert(!q('.ml-workbench').hidden,'Return to model');q('[data-ml-view="terms"]').click();assert(q('[data-ml-resource] .ar-diagram'),'Terms diagram');q('[data-ml-return]').click();
    const paletteProbe=document.createElement('span');paletteProbe.style.background='var(--site-secondary)';host.appendChild(paletteProbe);assert(getComputedStyle(q('.ml-canvas')).backgroundColor===getComputedStyle(paletteProbe).backgroundColor,'Chart does not match selected theme');paletteProbe.remove();
    assert(q('.ml-big-idea')?.textContent.length>80,'Beginner explanation missing');
    q('.ml-glossary summary').click();assert(q('.ml-glossary').open,'Glossary did not open');
    const svg=q('.ml-chart');assert(Number(svg.dataset.visible)===m.stages[0].count,'Initial count');
    for(let i=0;i<3;i++){q('[data-ml-next]').click();model.finishAnimation();}
    for(const [i,exercise] of (m.sourceExercises||[]).entries()){const box=q(`[data-review-exercise="${i}"]`);box.closest('details').querySelector('summary').click();assert(box.closest('details').open,'Review case expands');box.querySelector('[data-review-check]').click();assert(box.querySelector('[data-review-result]').textContent.includes('выбери'),'Review missing answer');box.querySelector(`input[value="${exercise.choices.findIndex(c=>!c.correct)}"]`).checked=true;box.querySelector('[data-review-check]').click();assert(box.querySelector('[data-review-result]').textContent.includes('ошибка'),'Review wrong answer');box.querySelector(`input[value="${exercise.choices.findIndex(c=>c.correct)}"]`).checked=true;box.querySelector('[data-review-check]').click();assert(box.querySelector('[data-review-result]').textContent.startsWith('Верно.'),'Review explanation');}
    const checkpoint=m.checkpoint.choices.findIndex(c=>c.correct),badCheckpoint=m.checkpoint.choices.findIndex(c=>!c.correct);
    q(`input[name="ml-checkpoint"][value="${badCheckpoint}"]`).checked=true;q('[data-ml-checkpoint]').click();assert(q('[data-ml-checkpoint-result]').classList.contains('wrong'),'Wrong checkpoint explanation');
    q(`input[name="ml-checkpoint"][value="${checkpoint}"]`).checked=true;q('[data-ml-checkpoint]').click();assert(q('[data-ml-checkpoint-result]').classList.contains('correct'),'Correct checkpoint explanation');
    if(lesson.key==='5.2'){q('[data-ml-distance]').value='8';q('[data-ml-distance]').dispatchEvent(new Event('input'));assert(q('[data-ml-size]').textContent.includes('12.50'),'Position calculator');q('[data-ml-distance]').value='0';q('[data-ml-distance]').dispatchEvent(new Event('input'));assert(q('[data-ml-size]').textContent.includes('положительное'),'Zero distance must be rejected');}
    assert(stages.length===4,'All theory stages');
    const first=q('.ml-candle');first.dispatchEvent(new FocusEvent('focus'));assert(q('[data-ml-inspector]').textContent.includes('O '),'Candle inspector');
    q('[data-ml-scale]').click();model.finishAnimation();assert(Number(svg.dataset.visible)===Math.ceil(m.stages[3].count/3),'Aggregation count');q('[data-ml-scale]').click();model.finishAnimation();
    q('[data-ml-annotations]').click();assert(q('[data-ml-overlay]').querySelector('.ml-guide')===null,'Toggle annotation');q('[data-ml-annotations]').click();
    q('[data-ml-branch]').click();model.finishAnimation();assert(q('[data-ml-branch]').getAttribute('aria-pressed')==='true','Alternate branch');
    q('[data-ml-next]').click();model.finishAnimation();assert(Number(svg.dataset.visible)===m.practice.count,'Blind future count');assert(q('[data-ml-branch]').disabled,'Alternate future locked');assert(q('[data-ml-scale]').disabled,'Scale locked during decision');
    q('[data-ml-answer]').click();assert(!model.state.revealed,'No reveal without decision');
    const correct=m.practice.choices.findIndex(c=>c.correct);q(`input[name="ml-practice"][value="${correct}"]`).checked=true;q('[data-ml-answer]').click();model.finishAnimation();assert(Number(svg.dataset.visible)===m.practiceBars.length,'Future revealed');assert(!q('[data-ml-assessment]').hidden,'Quiz available');
    q('[data-ml-quiz]').dispatchEvent(new Event('submit',{cancelable:true}));assert(q('[data-ml-complete]').disabled,'Missing quiz blocks completion');
    m.quiz.forEach((question,i)=>{const wrong=question.choices.findIndex(c=>!c.correct);q(`input[name="ml-q-${i}"][value="${wrong}"]`).checked=true;});q('[data-ml-quiz]').dispatchEvent(new Event('submit',{cancelable:true}));assert(q('[data-ml-complete]').disabled,'Wrong quiz blocks completion');
    m.quiz.forEach((question,i)=>{const answer=question.choices.findIndex(c=>c.correct);q(`input[name="ml-q-${i}"][value="${answer}"]`).checked=true;});q('[data-ml-quiz]').dispatchEvent(new Event('submit',{cancelable:true}));assert(!q('[data-ml-complete]').disabled,'Valid quiz unlocks completion');
    q('[data-ml-quiz]').dispatchEvent(new Event('change'));assert(q('[data-ml-complete]').disabled,'Edited answer invalidates score');q('[data-ml-quiz]').dispatchEvent(new Event('submit',{cancelable:true}));
    q('[data-ml-notes]').value='Проверочный конспект '+lesson.key;q('[data-ml-save]').click();await Promise.resolve();assert(saved.includes(lesson.key),'Save notes');q('[data-ml-complete]').click();await Promise.resolve();assert(completed,'Complete callback');
    assert(!host.querySelector('iframe,video'),'No video');assert(document.documentElement.scrollWidth<=document.documentElement.clientWidth,'Mobile overflow '+lesson.key);results.push(lesson.key);model.dispose();
  }
  document.body.dataset.audit=JSON.stringify({passed:results.length,expected:course.lessons.length,lessons:results,mobileWidth:innerWidth});document.body.dataset.auditReady='true';
})().catch(error=>{document.body.dataset.auditError=String(error.stack||error);document.body.dataset.auditReady='error';});
</script></body></html>
