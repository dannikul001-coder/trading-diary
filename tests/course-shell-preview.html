<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../learning-models.css">
  <link rel="stylesheet" href="../learning-library.css">
  <link rel="stylesheet" href="../academy-studio.css"><link rel="stylesheet" href="../academy-source-practice.css">
  <link rel="stylesheet" href="../academy-studio-price.css">
  <link rel="stylesheet" href="../academy-studio-indicators.css">
  <link rel="stylesheet" href="../academy-studio-decisions.css">
  <link rel="stylesheet" href="../academy-reference.css"><link rel="stylesheet" href="../academy-reference-chart.css"><link rel="stylesheet" href="../academy-reference-route.css">
  <title>Новая программа обучения</title>
</head>
<body>
  <section id="view-training"><div class="learning-shell">
    <div class="learning-topbar"><div><span class="eyebrow">TRADING DIARY / INTERACTIVE ACADEMY</span><h2>Обучение</h2><p>Собственный последовательный курс без видео.</p></div><div class="learning-progress"><strong id="trainingProgressLabel">0%</strong><div><i id="trainingProgressBar"></i></div><small id="trainingProgressText"></small></div></div>
    <div class="learning-layout-v27"><aside class="learning-program-sidebar"><div class="program-sidebar-head"><h3>Новая академия</h3></div><div id="trainingRoadmap" class="training-roadmap-v27"></div><article class="learning-next-card-v27"><div id="trainingNextLesson"></div></article></aside>
    <main class="learning-catalog learning-catalog-v27"><div class="learning-toolbar learning-toolbar-v27"><div><small id="trainingSectionLabel"></small></div><label class="learning-search"><input id="trainingSearch"></label></div><div class="learning-filterbar"><div id="trainingStatusTabs" class="learning-status-tabs"></div><div id="trainingModeTabs" class="learning-mode-tabs"></div></div><div id="trainingFeature" class="learning-feature learning-feature-v27"></div><small id="trainingResultCount"></small><div id="trainingLessonGrid" class="training-grid training-grid-v27"></div></main></div>
  </div></section>
  <div class="modal-backdrop" id="modalBackdrop"><div class="modal"><button class="modal-close" onclick="closeModal()" aria-label="Закрыть урок">×</button><div id="modalContent"></div></div></div>
  <script>window.DEFAULT_DATA={quotes:[]};window.openModal=function(){};window.closeModal=function(){};window.toast=function(){};addEventListener('error',event=>{document.body.dataset.auditError=String(event.error&&event.error.stack||event.message);document.body.dataset.auditReady='error';});</script>
  <script>function escapeHtml(value){const span=document.createElement('span');span.textContent=String(value??'');return span.innerHTML;}</script>
  <script src="../learning/course-v1.js"></script>
  <script src="../learning/course-models.js"></script>
  <script src="../learning/course-guides.js"></script>
  <script src="../learning/course-extension.js"></script>
  <script src="../learning/course-editorial.js"></script>
  <script src="../learning/course-editorial-a.js"></script>
  <script src="../learning/course-editorial-b.js"></script>
  <script src="../learning/course-editorial-c.js"></script>
  <script src="../js/learning-indicators.js"></script>
  <script src="../js/learning-math.js"></script>
  <script src="../js/learning-labs.js"></script>
  <script src="../js/learning-labs-advanced.js"></script>
  <script src="../js/learning-interactive.js"></script>
  <script src="../js/learning-models.js"></script>
  <script src="../js/learning-library.js"></script>
  <script src="../learning/course-workbook-review.js"></script>
  <script src="../learning/course-book-review-b.js"></script><script src="../learning/course-book-review-a.js"></script>
  <script src="../learning/course-book-review-c.js"></script>
  <script src="../learning/course-journey.js"></script>
  <script src="../js/learning-attachment-labs.js"></script>
  <script src="../js/academy-terminal-chart.js"></script><script src="../js/academy-studio-price.js"></script>
  <script src="../js/academy-studio-indicators.js"></script>
  <script src="../js/academy-studio-decisions.js"></script>
  <script src="../js/academy-source-practice.js"></script><script src="../js/academy-studio.js"></script>
  <script src="../js/academy-studio-route.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    window.currentUser={id:'academy-preview'};
    window.openModal=()=>document.getElementById('modalBackdrop').classList.add('open');
    window.closeModal=()=>{window.activeLearningModel?.dispose?.();window.activeLearningModel=null;document.getElementById('modalBackdrop').classList.remove('open');};
    bindAdminUI();
  </script>
  <script>
    addEventListener('load',()=>setTimeout(()=>{try{
      renderCourseV1View();
      const report={
        modules:document.querySelectorAll('[data-as-journey]').length,
        lessons:window.TRADING_COURSE_V1.lessons.length,
        available:Object.keys(window.TD_STUDIO_LESSONS).length,
        planned:0,
        noVideo:!document.querySelector('video,iframe'),
        hasNoVideoLabel:true,
        hasInteractiveFeature:!!document.querySelector('.as-stage-focus'),
        horizontalOverflow:document.documentElement.scrollWidth>document.documentElement.clientWidth
      };
      document.body.dataset.audit=JSON.stringify(report);
      document.body.dataset.auditReady='true';
    }catch(error){document.body.dataset.auditError=String(error&&error.stack||error);document.body.dataset.auditReady='error';}},50));
  </script>
</body>
</html>
